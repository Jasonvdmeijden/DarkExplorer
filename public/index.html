<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#12121a">
  <title>DarkExplorer</title>
  <link id="theme-css" rel="stylesheet" href="/css/themes/dark.css">
  <link rel="stylesheet" href="/css/app.css">

  <!-- CDN libraries -->
  <link rel="stylesheet" href="/vendor/xterm.css">
  <script src="/vendor/xterm.js"></script>
  <script src="/vendor/xterm-addon-fit.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js" defer></script>
  <link id="hljs-dark"  rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
  <link id="hljs-light" rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-light.min.css" disabled>
</head>
<body>

  <!-- ── Top toolbar ── -->
  <header id="toolbar">

    <div class="toolbar-left">
      <button class="icon-btn" id="btn-toggle-tree" title="Toggle tree panel">☰</button>
      <button class="icon-btn" id="btn-back"    title="Back (Alt+Left)">&#8592;</button>
      <button class="icon-btn" id="btn-forward" title="Forward (Alt+Right)">&#8594;</button>
      <button class="icon-btn" id="btn-up"      title="Up (Alt+Up)">&#8593;</button>
      <!-- breadcrumb / path bar -->
      <div id="pathbar">
        <nav id="breadcrumb" aria-label="Path"></nav>
        <input id="path-input" type="text" spellcheck="false" placeholder="Type a path…" style="display:none">
      </div>
    </div>

    <div class="toolbar-center">
      <button class="icon-btn" id="btn-search" title="Search (Ctrl+F)">
        <svg width="15" height="15" viewBox="0 0 15 15" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="6.5" cy="6.5" r="4.5"/>
          <line x1="9.9" y1="9.9" x2="13.5" y2="13.5"/>
        </svg>
      </button>
    </div>

    <div class="toolbar-right">
      <button class="icon-btn" id="btn-view-mosaic"  title="Gallery view"  data-view="mosaic">⊞</button>
      <button class="icon-btn" id="btn-view-details" title="Details view"  data-view="details">☰</button>
      <button class="icon-btn" id="btn-view-list"    title="List view"     data-view="list">≡</button>
      <span class="toolbar-sep"></span>
      <button class="icon-btn" id="btn-new-folder" title="New folder (Ctrl+Shift+N)">📁⁺</button>
      <button class="icon-btn" id="btn-filter"     title="Filter current view">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon>
        </svg>
      </button>
      <button class="icon-btn" id="btn-upload"     title="Upload files">↑</button>
      <span class="toolbar-sep"></span>
      <button class="icon-btn" id="btn-theme"        title="Toggle dark / light">◑</button>
      <button class="icon-btn" id="btn-theme-picker" title="Pick a theme">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 2C6.49 2 2 6.49 2 12s4.49 10 10 10c1.38 0 2.5-1.12 2.5-2.5 0-.61-.23-1.17-.64-1.6-.39-.41-.39-1.07.02-1.45.21-.2.5-.32.82-.32H16c3.31 0 6-2.69 6-6 0-4.96-4.49-9-10-9z"/>
          <circle cx="6.5"  cy="12.5" r="1.2" fill="currentColor" stroke="none"/>
          <circle cx="9.5"  cy="7.5"  r="1.2" fill="currentColor" stroke="none"/>
          <circle cx="14.5" cy="7.5"  r="1.2" fill="currentColor" stroke="none"/>
          <circle cx="17.5" cy="12.5" r="1.2" fill="currentColor" stroke="none"/>
        </svg>
      </button>
      <button class="icon-btn" id="btn-settings"     title="Settings">⚙</button>
    </div>

  </header>

  <!-- ── Main layout ── -->
  <div id="layout">

    <!-- Left panel: tree + booked + git + fav -->
    <aside id="panel-left">
      <div id="panel-left-top" class="panel-section">
        <div class="panel-tabs" id="left-tabs-top">
          <button class="ptab active" data-panel="tree">Tree</button>
          <button class="ptab"        data-panel="favourites">Fav</button>
          <button class="ptab"        data-panel="bookmarks">Booked</button>
          <button class="ptab"        data-panel="git">Git</button>
        </div>
        <div id="tree-panel"       class="panel-content"></div>
        <div id="favourites-panel" class="panel-content" style="display:none"></div>
        <div id="bookmarks-panel"  class="panel-content" style="display:none;flex-direction:column"></div>
        <div id="git-panel"        class="panel-content" style="display:none;overflow-y:auto"></div>
      </div>

      <div id="splitter-side-v" class="splitter splitter-h" style="display:none"></div>

      <div id="panel-left-bottom" class="panel-section" style="display:none;height:200px">
        <div class="panel-tabs" id="left-tabs-bottom"></div>
        <div class="panel-content-bottom"></div>
      </div>
      
      <div id="side-split-dropzone" style="display:none">Drop here to split</div>
    </aside>

    <div id="splitter-left" class="splitter splitter-v"></div>

    <!-- Center: tabs + explorer / preview split -->
    <main id="center">
      <div id="tabs-bar">
        <div id="tabs-list"></div>
        <button id="btn-new-tab" title="New tab">+</button>
        <button id="btn-split"   title="Split pane">⧉</button>
      </div>

      <div id="panes">
        <!-- pane(s) rendered here by panels.js -->
      </div>
    </main>

    <div id="splitter-right" class="splitter splitter-v" style="display:none"></div>

    <!-- Right panel: kept for panels.js layout ref, content moved to modal -->
    <aside id="panel-right" style="display:none"></aside>

  </div>

  <!-- Bottom panel: terminal -->
  <div id="splitter-bottom" class="splitter splitter-h" style="display:none"></div>
  <div id="panel-bottom" style="display:none">
    <div class="panel-tabs">
      <span style="flex:1"></span>
      <button class="icon-btn" id="btn-term-mode"  title="Toggle PTY / runner">⇄</button>
      <button class="icon-btn" id="btn-term-shell" title="Switch shell">⚡</button>
      <button class="icon-btn" id="btn-term-close" title="Close terminal">✕</button>
    </div>
    <div id="terminal-container"></div>
  </div>

  <!-- Status bar -->
  <footer id="statusbar">
    <div style="display:flex;align-items:center;gap:.5rem">
      <button class="icon-btn" id="btn-disk" title="Disk Usage">💽 Disk</button>
      <span id="status-items"></span>
    </div>
    <span class="flex-gap"></span>
    <div id="sys-stats">
      <span class="stat-chip" id="stat-cpu-tip"  title="CPU Usage">CPU <b id="stat-cpu-val">—</b></span>
      <span class="stat-chip" id="stat-mem-tip"  title="Memory Usage">MEM <b id="stat-mem-val">—</b></span>
      <span class="stat-chip" id="stat-disk-tip" title="Disk Usage">DSK <b id="stat-disk-val">—</b></span>
      <span class="stat-chip" id="stat-net-tip"  title="Network Usage">NET <b id="stat-net-val">—</b></span>
    </div>
    <button class="icon-btn" id="btn-toggle-terminal" title="Toggle terminal (Ctrl+`)">⌨</button>
  </footer>

  <!-- Context menu -->
  <ul id="context-menu" role="menu"></ul>

  <!-- Disk Analyzer view (moved to pane when active) -->
  <div id="disk-modal-wrapper" style="display:none">
    <div id="disk-modal-content" style="display:flex; flex-direction:column; height:100%; width:100%; background:var(--bg-base)">
      <div class="disk-header">
        <div id="disk-tabs"></div>
        <div id="disk-breadcrumb"></div>
        <span class="flex-gap"></span>
        <span id="disk-status" style="font-size:11px;color:var(--text-muted);margin-right:1rem"></span>
        <button id="btn-disk-close" title="Close" style="display:none">&#x2715;</button>
      </div>
      <div class="disk-body">
        <div class="disk-svg-container">
          <svg id="disk-svg" viewBox="0 0 600 600">
            <g id="disk-arcs"></g>
            <circle id="disk-center" cx="300" cy="300" r="75" fill="var(--bg-panel)"></circle>
            <text id="disk-center-text" x="300" y="300" text-anchor="middle" dominant-baseline="middle"></text>
          </svg>
        </div>
        <div class="disk-list-container">
          <div class="disk-list-header">
             <div class="title" id="disk-list-title" style="flex:1; cursor:pointer;" title="Go up">...</div>
             <div class="size" id="disk-list-size">...</div>
          </div>
          <div id="disk-list"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Preview modal — uses <dialog> + showModal() for guaranteed top-layer rendering -->
  <dialog id="preview-modal">
    <div id="preview-modal-header">
      <div id="preview-modal-file">
        <span id="preview-modal-icon"></span>
        <span id="preview-modal-title"></span>
      </div>
      <div id="preview-modal-tabs">
        <button class="pv-tab active" data-mode="rich">Rich</button>
        <button class="pv-tab"        data-mode="raw">Raw</button>
        <button class="pv-tab"        data-mode="meta">Meta</button>
      </div>
      <button id="btn-preview-prev" title="Previous file (←)" style="display:none">&#8592;</button>
      <button id="btn-preview-next" title="Next file (→)"     style="display:none">&#8594;</button>
      <button id="btn-preview-edit"   title="Edit file"       style="display:none">✏</button>
      <button id="btn-preview-newtab" title="Open in new tab">&#x2197;</button>
      <button id="btn-preview-close"  title="Close (Esc)">&#x2715;</button>
    </div>
    <div id="preview-content"></div>
    <div id="preview-resize-handle" aria-hidden="true"></div>
  </dialog>

  <!-- Properties popup dialog -->
  <dialog id="props-dialog">
    <div id="props-header">
      <span id="props-title">Properties</span>
      <button id="btn-props-close" title="Close">&#x2715;</button>
    </div>
    <div id="props-tabs">
      <button class="props-tab active" data-tab="general">General</button>
      <button class="props-tab"        data-tab="sharing">Sharing</button>
      <button class="props-tab"        data-tab="security">Security</button>
    </div>
    <div id="props-body"></div>
  </dialog>

  <!-- Hidden file input for upload -->
  <input type="file" id="upload-input" multiple style="display:none">

  <!-- JS modules -->
  <script src="/js/ws.js"></script>
  <script src="/js/state.js"></script>
  <script src="/js/theme.js"></script>
  <script src="/js/tabs.js"></script>
  <script src="/js/panels.js"></script>
  <script src="/js/bookmarks.js"></script>
  <script src="/js/clipboard.js"></script>
  <script src="/js/preview.js"></script>
  <script src="/js/terminal.js"></script>
  <script src="/js/search.js"></script>
  <script src="/js/disk.js"></script>
  <script src="/js/tree.js"></script>
  <script src="/js/favourites.js"></script>
  <script src="/js/explorer.js"></script>
  <script src="/js/git.js"></script>
  <script src="/js/stats.js"></script>
  <script src="/js/theme-builder.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#12121a">
  <link rel="icon" href="data:,">
  <title>DarkExplorer</title>
  <link id="theme-css" rel="stylesheet" href="/css/themes/dark.css">
  <link rel="stylesheet" href="/css/app.css">
  <link rel="stylesheet" href="/css/glass-effect.css">
  <link rel="stylesheet" href="/css/media.css">
  <link rel="stylesheet" href="/css/stream.css">

  <!-- CDN libraries -->
  <link rel="stylesheet" href="/vendor/xterm.css">
  <script src="/vendor/xterm.js"></script>
  <script src="/vendor/xterm-addon-fit.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js" defer></script>
  <link id="hljs-dark"  rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
  <link id="hljs-light" rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-light.min.css" disabled>

  <!-- CodeMirror Editor -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/dracula.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/neo.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/javascript/javascript.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/python/python.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/xml/xml.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/css/css.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/markdown/markdown.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/clike/clike.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/shell/shell.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/meta.min.js" defer></script>
</head>
<body>


  <!-- ── Top toolbar ── -->
  <header id="toolbar">

    <div class="toolbar-left">
      <!-- nav buttons -->
      <button class="icon-btn" id="btn-toggle-tree" title="Toggle tree panel">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>
      <button class="icon-btn" id="btn-back"    title="Back (Alt+Left)">&#8592;</button>
      <button class="icon-btn" id="btn-forward" title="Forward (Alt+Right)">&#8594;</button>
      <!-- up-button + breadcrumb/path bar always share one row, up-button on the left -->
      <div id="up-pathbar-row">
        <button class="icon-btn" id="btn-up" title="Up (Alt+Up)">&#8593;</button>
        <div id="pathbar">
          <nav id="breadcrumb" aria-label="Path"></nav>
          <input id="path-input" type="text" spellcheck="false" placeholder="Type a path…" style="display:none">
        </div>
      </div>
    </div>

    <div class="toolbar-center">
      <button class="icon-btn" id="btn-search" title="Search (Ctrl+F)">
        <svg width="16" height="16" viewBox="0 0 15 15" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="6.5" cy="6.5" r="4.5"/>
          <line x1="9.9" y1="9.9" x2="13.5" y2="13.5"/>
        </svg>
      </button>
    </div>

    <div class="toolbar-right">
      <div class="view-mode-group" id="view-mode-buttons">
      <button class="icon-btn" id="btn-view-mosaic"  title="Gallery view"  data-view="mosaic">⊞</button>
      <button class="icon-btn" id="btn-view-details" title="Details view"  data-view="details">☰</button>
      <button class="icon-btn" id="btn-view-list"    title="List view"     data-view="list">≡</button>
      <button class="icon-btn" id="btn-view-disk"    title="Disk usage analyser" data-view="disk">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="9"/>
          <path d="M12 3 A9 9 0 0 1 21 12 L12 12 Z" fill="currentColor" stroke="none" opacity=".55"/>
          <path d="M21 12 A9 9 0 0 1 14.5 20.7 L12 12 Z" fill="currentColor" stroke="none" opacity=".25"/>
          <circle cx="12" cy="12" r="3" fill="var(--bg-surface)" stroke="currentColor" stroke-width="1.25"/>
        </svg>
      </button>
      <button class="icon-btn" id="btn-view-media"   title="Media Mode" data-view="media">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="2.5" y="5" width="19" height="13" rx="2.5"/>
          <path d="M10 9.2v5.6l5-2.8z" fill="currentColor" stroke="none"/>
          <line x1="8" y1="21" x2="16" y2="21"/>
        </svg>
      </button>
      <button class="icon-btn" id="btn-view-stream"  title="App Mode" data-view="stream">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="3" width="7" height="7" rx="1.5"/>
          <rect x="14" y="3" width="7" height="7" rx="1.5"/>
          <rect x="3" y="14" width="7" height="7" rx="1.5"/>
          <rect x="14" y="14" width="7" height="7" rx="1.5"/>
        </svg>
      </button>
      </div>
      <div class="view-mode-dropdown" id="view-mode-dropdown">
        <button class="icon-btn" id="btn-view-dropdown-trigger" title="View mode">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M1.5 12S5.5 5 12 5s10.5 7 10.5 7-4 7-10.5 7S1.5 12 1.5 12z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
        <div class="view-mode-menu" id="view-mode-menu"></div>
      </div>
      <span class="toolbar-sep"></span>
      <button class="icon-btn" id="btn-new-folder" title="New folder (Ctrl+Shift+N)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
          <line x1="12" y1="11" x2="12" y2="17"/><line x1="9" y1="14" x2="15" y2="14"/>
        </svg>
      </button>
      <button class="icon-btn" id="btn-sort"       title="Sort & Group View">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <polyline points="19 12 12 19 5 12"></polyline>
        </svg>
      </button>
      <button class="icon-btn" id="btn-filter"     title="Filter current view">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon>
        </svg>
      </button>
      <button class="icon-btn" id="btn-upload"     title="Upload files">↑</button>
      <span class="toolbar-sep"></span>

      <button class="icon-btn" id="btn-app-settings" title="Settings">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </button>
    </div>

  </header>

  <!-- ── Main layout ── -->
  <div id="layout">

    <!-- Left panel: tree + booked + git + fav -->
    <aside id="panel-left">
      <div id="panel-left-top" class="panel-section">
        <div class="panel-tabs" id="left-tabs-top">
          <button class="ptab active" data-panel="tree">Tree</button>
          <button class="ptab"        data-panel="bookmarks">Quick</button>
          <button class="ptab"        data-panel="git">Git</button>
          <button class="icon-btn" id="btn-panel-left-close" title="Close">&#x2715;</button>
        </div>
        <div id="tree-panel"       class="panel-content"></div>
        <div id="bookmarks-panel"  class="panel-content" style="display:none;flex-direction:column">
          <!-- Bookmarks and Favorites groups will be rendered here -->
        </div>
        <div id="git-panel"        class="panel-content" style="display:none;overflow-y:auto"></div>
      </div>

      <div id="splitter-side-v" class="splitter splitter-h" style="display:none"></div>

      <div id="panel-left-bottom" class="panel-section" style="display:none;height:200px">
        <div class="panel-tabs" id="left-tabs-bottom"></div>
        <div class="panel-content-bottom"></div>
      </div>
      
      <div id="side-split-dropzone" style="display:none">Drop here to split</div>
    </aside>

    <div id="splitter-left" class="splitter splitter-v"></div>

    <!-- Center: tabs + explorer / preview split -->
    <main id="center">
      <div id="tabs-bar">
        <div id="tabs-list"></div>
        <button id="btn-new-tab" title="New tab">+</button>
        <button id="btn-split"   title="Split pane">⧉</button>
      </div>

      <div id="panes">
        <!-- pane(s) rendered here by panels.js -->
      </div>
    </main>

    <div id="splitter-right" class="splitter splitter-v" style="display:none"></div>

    <!-- Right panel: kept for panels.js layout ref, content moved to modal -->
    <aside id="panel-right" style="display:none"></aside>

  </div>

  <!-- Bottom panel: terminal -->
  <div id="splitter-bottom" class="splitter splitter-h" style="display:none"></div>
  <div id="panel-bottom" style="display:none">
    <div class="panel-tabs" id="term-header">
      <div id="term-mods">
        <button class="term-key" data-mod="meta"  title="Win / Cmd">⌘</button>
        <button class="term-key" data-mod="ctrl"  title="Ctrl">Ctrl</button>
        <button class="term-key" data-mod="alt"   title="Alt">Alt</button>
        <button class="term-key" data-mod="shift" title="Shift">⇧</button>
        <button class="term-key" data-key="esc"   title="Escape">Esc</button>
      </div>
      <div id="term-arrows">
        <button class="term-key" data-arrow="up"    title="Up">↑</button>
        <button class="term-key" data-arrow="down"  title="Down">↓</button>
        <button class="term-key" data-arrow="left"  title="Left">←</button>
        <button class="term-key" data-arrow="right" title="Right">→</button>
      </div>
      <span id="term-spacer" style="flex:1"></span>
      <button class="icon-btn" id="btn-term-mode"  title="Toggle PTY / runner">⇄</button>
      <button class="icon-btn" id="btn-term-shell" title="Switch shell">⚡</button>
      <button class="icon-btn" id="btn-term-close" title="Close terminal">✕</button>
    </div>
    <div id="terminal-container"></div>
  </div>

  <!-- Status bar -->
  <footer id="statusbar">
    <span id="status-items"></span>
    <span class="flex-gap"></span>
    <div id="sys-stats">
      <span class="stat-chip" id="stat-cpu-tip"  title="CPU Usage">CPU <b id="stat-cpu-val">—</b></span>
      <span class="stat-chip" id="stat-gpu-tip"  title="GPU Usage" style="display:none">GPU <b id="stat-gpu-val">—</b></span>
      <span class="stat-chip" id="stat-mem-tip"  title="Memory Usage">MEM <b id="stat-mem-val">—</b></span>
      <span class="stat-chip" id="stat-disk-tip" title="Disk Usage">DSK <b id="stat-disk-val">—</b></span>
      <span class="stat-chip" id="stat-net-tip"  title="Network Usage">NET <b id="stat-net-val">—</b></span>
    </div>
    <button class="icon-btn" id="btn-toggle-terminal" title="Toggle terminal (Ctrl+`)">⌨</button>
  </footer>

  <!-- Context menu -->
  <ul id="context-menu" role="menu"></ul>

  <!-- Preview modal — uses <dialog> + showModal() for guaranteed top-layer rendering -->
  <dialog id="preview-modal">
    <div id="preview-modal-header">
      <div id="preview-modal-file">
        <span id="preview-modal-icon"></span>
        <span id="preview-modal-title"></span>
      </div>
      <div id="preview-modal-tabs">
        <button class="pv-tab active" data-mode="rich">Rich</button>
        <button class="pv-tab"        data-mode="raw">Raw</button>
        <button class="pv-tab"        data-mode="meta">Meta</button>
      </div>
      <button id="btn-preview-prev" title="Previous file (←)" style="display:none">&#8592;</button>
      <button id="btn-preview-next" title="Next file (→)"     style="display:none">&#8594;</button>
      <button id="btn-preview-edit"   title="Edit file"       style="display:none">✏</button>
      <button id="btn-preview-newtab" title="Open in new tab">&#x2197;</button>
      <button id="btn-preview-close"  title="Close (Esc)">&#x2715;</button>
    </div>
    <div id="preview-content"></div>
    <div id="preview-resize-handle" aria-hidden="true"></div>
  </dialog>

  <!-- Properties popup dialog -->
  <dialog id="props-dialog">
    <div id="props-header">
      <span id="props-title">Properties</span>
      <button id="btn-props-close" title="Close">&#x2715;</button>
    </div>
    <div id="props-tabs">
      <button class="props-tab active" data-tab="general">General</button>
      <button class="props-tab"        data-tab="sharing">Sharing</button>
      <button class="props-tab"        data-tab="security">Security</button>
    </div>
    <div id="props-body"></div>
  </dialog>

  <!-- Hidden file input for upload -->
  <input type="file" id="upload-input" multiple style="display:none">

  <!-- JS modules -->
  <script src="/js/ws.js"></script>
  <script src="/js/drives.js"></script>
  <script src="/js/video-preview.js"></script>
  <script src="/js/state.js"></script>
  <script src="/js/theme.js"></script>
  <script src="/js/tabs.js"></script>
  <script src="/js/panels.js"></script>
  <script src="/js/bookmarks.js"></script>
  <script src="/js/clipboard.js"></script>
  <script src="/js/preview.js"></script>
  <script src="/js/terminal.js"></script>
  <script src="/js/search.js"></script>
  <script src="/js/disk.js"></script>
  <script src="/js/tree.js"></script>
  <script src="/js/favourites.js"></script>
  <script src="/js/explorer.js"></script>
  <script src="/js/git.js"></script>
  <script src="/js/stats.js"></script>
  <script src="/js/media.js"></script>
  <script src="/js/stream.js"></script>
  <script src="/js/settings.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
